log_format inventory_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
  access_log /var/log/nginx/access.log inventory_safe;
  listen 80;
  listen [::]:80;
  server_name _;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  root /usr/share/nginx/html;
  index index.html;

  # Verify the built application without depending on the API.
  location = /healthz {
    access_log off;
    try_files /index.html =503;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
