services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: inventory, POSTGRES_USER: inventory, POSTGRES_PASSWORD: inventory }
    ports: ["5432:5432"]
    volumes: ["inventory_pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"], interval: 5s, timeout: 5s, retries: 10 }
volumes: { inventory_pg: {} }
